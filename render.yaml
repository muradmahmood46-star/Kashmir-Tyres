services:
  - type: web
    name: kashmir-tyres-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node server/index.cjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kashmir-tyres-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: kashmir-tyres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: kashmir-tyres-db
    plan: free
    region: singapore
